name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build (warnings are errors)
        run: dotnet build Tuxflix.slnx -c Release
      - name: Core tests
        run: dotnet test tests/Tuxflix.Tests/Tuxflix.Tests.csproj -c Release --no-build
      - name: Application tests
        run: dotnet test tests/Tuxflix.HeadlessTests/Tuxflix.HeadlessTests.csproj -c Release --no-build
