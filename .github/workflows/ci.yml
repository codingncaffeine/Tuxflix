name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # A hung test ends the job here, not at GitHub's six-hour limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build (warnings are errors)
        run: dotnet build Tuxflix.slnx -c Release
      # Every test is named as it passes, and one that hangs is stopped after two minutes with a dump.
      - name: Core tests
        run: dotnet test tests/Tuxflix.Tests/Tuxflix.Tests.csproj -c Release --no-build --blame-hang --blame-hang-timeout 2m --logger "console;verbosity=normal" --results-directory TestResults
      - name: Application tests
        run: dotnet test tests/Tuxflix.HeadlessTests/Tuxflix.HeadlessTests.csproj -c Release --no-build --blame-hang --blame-hang-timeout 2m --logger "console;verbosity=normal" --results-directory TestResults
      - name: Keep the hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 7
